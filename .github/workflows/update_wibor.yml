name: Update WIBOR 3M

on:
  # Harmonogram wylaczony: stooq (jedyne zrodlo WIBOR-u) postawil zapore
  # anty-botowa 2026-06-04, a yfinance ani NBP tego wskaznika nie publikuja.
  # Bez tego workflow konczyl sie kodem 1 codziennie. Wraca przez odkomentowanie,
  # gdy znajdzie sie zrodlo (np. GPW Benchmark).
  # schedule:
  #   - cron: '0 6 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch WIBOR 3M
        run: python fetch_wibor.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "WIBOR: aktualizacja $(date '+%Y-%m-%d')" && git push)
